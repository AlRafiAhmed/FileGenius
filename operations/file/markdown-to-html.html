<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML - FileGenius</title>
    <meta name="description" content="Convert Markdown (.md) documents into clean, sanitized HTML with live rendered preview and code export.">

    <script src="../../assets/libraries/tailwind.js"></script>
    <link rel="stylesheet" href="../../assets/libraries/font-awesome.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="../../assets/libraries/marked.min.js"></script>
    <script src="../../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <header class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="../../index.html" class="flex items-center gap-2.5 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 dark:shadow-none group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <span class="text-xl font-bold text-slate-900 dark:text-white">File<span class="text-indigo-600 dark:text-indigo-400">Genius</span></span>
            </a>

            <div class="flex items-center gap-3">
                <a href="../../index.html#file-section" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden sm:inline">Back to Tools</span>
                </a>
                <button type="button" id="quickThemeToggleBtn" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-amber-400 flex items-center justify-center transition shadow-2xs focus:outline-none" title="Toggle Light / Dark Theme">
                    <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
                </button>
                                <a href="../../contact.html" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 transition" title="Contact Administrator">
                    <i class="fa-solid fa-envelope text-indigo-500"></i>
                    <span class="hidden sm:inline">Contact</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-50 dark:bg-orange-950/60 text-orange-600 dark:text-orange-400 text-xs font-semibold mb-3 border border-orange-100 dark:border-orange-900">
                <i class="fa-brands fa-markdown"></i> Markdown Web Compiler
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-2">Markdown to HTML</h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm max-w-xl mx-auto">
                Parse Markdown syntax into sanitized HTML5 with live side-by-side rendering and full XSS protection.
            </p>
        </div>

        <div id="errorAlert" class="hidden mb-6 p-4 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0 text-base"></i>
            <span id="errorMessage"></span>
        </div>

        <div class="space-y-6">
            <div id="dropZone" class="relative border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-indigo-500 rounded-3xl p-6 text-center bg-white dark:bg-slate-800 transition cursor-pointer group shadow-2xs">
                <input type="file" id="fileInput" accept=".md,.markdown,text/markdown" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <div class="flex items-center justify-center gap-3">
                    <i class="fa-brands fa-markdown text-3xl text-orange-500"></i>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200">Upload Markdown file or drag it here</span>
                </div>
            </div>

            <!-- Editor & Split View Workspace -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 shadow-xs space-y-4 transition-colors">
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-700/80 pb-3">
                    <div class="flex items-center gap-2">
                        <button type="button" id="tabSplit" class="px-3.5 py-1.5 rounded-xl bg-orange-600 text-white text-xs font-bold shadow-2xs">Split View</button>
                        <button type="button" id="tabPreview" class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold hover:bg-slate-200">Preview Only</button>
                        <button type="button" id="tabCode" class="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold hover:bg-slate-200">Raw HTML</button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" id="loadSampleBtn" class="text-xs font-semibold text-orange-600 dark:text-orange-400 hover:underline">Load Sample</button>
                        <button type="button" id="copyHtmlBtn" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold transition">
                            <i class="fa-solid fa-copy mr-1"></i> <span id="copyBtnText">Copy HTML</span>
                        </button>
                        <button type="button" id="downloadHtmlBtn" class="px-3.5 py-1.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold transition shadow-2xs">
                            <i class="fa-solid fa-download mr-1"></i> Download .html
                        </button>
                    </div>
                </div>

                <!-- Panes Container -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="panesContainer">
                    <!-- Left: Markdown Input -->
                    <div id="inputPane" class="space-y-1">
                        <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400">Markdown Source</label>
                        <textarea id="markdownInput" rows="16" placeholder="# Enter Markdown here..." class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 font-mono text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                    </div>

                    <!-- Right: Rendered HTML Preview -->
                    <div id="previewPane" class="space-y-1">
                        <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400">Rendered HTML Output</label>
                        <div id="htmlPreviewArea" class="w-full p-5 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 max-h-[380px] overflow-y-auto prose dark:prose-invert max-w-none text-xs leading-relaxed"></div>
                    </div>

                    <!-- Raw HTML Pane (Hidden by default) -->
                    <div id="rawHtmlPane" class="hidden col-span-2 space-y-1">
                        <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400">Raw HTML Code</label>
                        <textarea id="rawHtmlArea" rows="16" readonly class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 font-mono text-xs leading-relaxed focus:outline-none"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 transition-colors">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            &copy; 2026 FileGenius &bull; In-Browser Markdown to HTML Converter
        </div>
    </footer>

    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            const markdownInput = document.getElementById('markdownInput');
            const htmlPreviewArea = document.getElementById('htmlPreviewArea');
            const rawHtmlArea = document.getElementById('rawHtmlArea');

            const tabSplit = document.getElementById('tabSplit');
            const tabPreview = document.getElementById('tabPreview');
            const tabCode = document.getElementById('tabCode');

            const inputPane = document.getElementById('inputPane');
            const previewPane = document.getElementById('previewPane');
            const rawHtmlPane = document.getElementById('rawHtmlPane');
            const panesContainer = document.getElementById('panesContainer');

            const loadSampleBtn = document.getElementById('loadSampleBtn');
            const copyHtmlBtn = document.getElementById('copyHtmlBtn');
            const copyBtnText = document.getElementById('copyBtnText');
            const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

            let sanitizedHtml = '';

            FileGenius.Utils.setupDropzone(dropZone, fileInput, async (files) => {
                if (files && files[0]) {
                    const text = await FileGenius.Utils.readFileAsText(files[0]);
                    markdownInput.value = text;
                    updateConversion();
                }
            });

            loadSampleBtn.addEventListener('click', () => {
                markdownInput.value = `# Welcome to FileGenius Markdown

This is an **in-browser Markdown converter** with XSS sanitization.

## Key Features
- **Zero Server Uploads**: 100% private.
- Lists, *emphasis*, tables, and code blocks.
- Instant live preview.

### Sample Table
| Feature | Supported | Performance |
| :--- | :---: | :--- |
| HTML Sanitization | Yes | High |
| Code Highlighting | Yes | Native |
| Local Storage | Yes | Instant |

> "Clean code and high performance in the browser."

\`\`\`javascript
function helloWorld() {
    console.log("FileGenius: Client-side file tools");
}
\`\`\`
`;
                updateConversion();
            });

            function updateConversion() {
                const md = markdownInput.value;
                if (!md.trim()) {
                    htmlPreviewArea.innerHTML = '<p class="text-slate-400">No content to preview.</p>';
                    rawHtmlArea.value = '';
                    sanitizedHtml = '';
                    return;
                }

                const rawHtml = marked.parse(md);
                sanitizedHtml = FileGenius.Utils.sanitizeHtml(rawHtml);

                htmlPreviewArea.innerHTML = sanitizedHtml;
                rawHtmlArea.value = sanitizedHtml;
            }

            markdownInput.addEventListener('input', updateConversion);

            // Tab Switching
            function setTab(active) {
                [tabSplit, tabPreview, tabCode].forEach(btn => {
                    btn.classList.remove('bg-orange-600', 'text-white', 'shadow-2xs');
                    btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-300');
                });
                active.classList.add('bg-orange-600', 'text-white', 'shadow-2xs');
                active.classList.remove('bg-slate-100', 'dark:bg-slate-700');
            }

            tabSplit.addEventListener('click', () => {
                setTab(tabSplit);
                panesContainer.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
                inputPane.classList.remove('hidden');
                previewPane.classList.remove('hidden');
                rawHtmlPane.classList.add('hidden');
            });

            tabPreview.addEventListener('click', () => {
                setTab(tabPreview);
                panesContainer.className = 'grid grid-cols-1 gap-4';
                inputPane.classList.add('hidden');
                previewPane.classList.remove('hidden');
                rawHtmlPane.classList.add('hidden');
            });

            tabCode.addEventListener('click', () => {
                setTab(tabCode);
                panesContainer.className = 'grid grid-cols-1 gap-4';
                inputPane.classList.add('hidden');
                previewPane.classList.add('hidden');
                rawHtmlPane.classList.remove('hidden');
            });

            copyHtmlBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(sanitizedHtml).then(() => {
                    copyBtnText.textContent = 'Copied!';
                    setTimeout(() => copyBtnText.textContent = 'Copy HTML', 2000);
                });
            });

            downloadHtmlBtn.addEventListener('click', () => {
                const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendered Markdown Document</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #1e293b; }
table { border-collapse: collapse; width: 100%; margin: 20px 0; }
th, td { border: 1px solid #cbd5e1; padding: 8px 12px; }
th { background-color: #f1f5f9; }
code { background-color: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
pre code { display: block; padding: 16px; overflow-x: auto; }
blockquote { border-left: 4px solid #f97316; margin: 0; padding-left: 16px; color: #64748b; }
</style>
</head>
<body>
${sanitizedHtml}
</body>
</html>`;
                const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                FileGenius.Utils.downloadBlob(blob, 'markdown_export.html');
            });

            // Initial load
            loadSampleBtn.click();
        });
    </script>
</body>
</html>
